<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O que dizem nossos pacientes</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;

      background: #000;

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;

    }

</head>
<body>
  <video
    class="video-pacientes"
    controls
    playsinline
    preload="metadata"
    aria-label="Depoimentos dos nossos pacientes"
